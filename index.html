<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title><%= htmlWebpackPlugin.options.title %></title>
</head>
<body onload="load()">
  <div id="app-container"></div>
  <script>
    function load(){
      // Initialize the new application structure
      if (window.SpreadsheetApp) {
        new SpreadsheetApp('app-container');
      } else {
        console.error('SpreadsheetApp not loaded');
      }
    }
  </script>
</body>
</html>
